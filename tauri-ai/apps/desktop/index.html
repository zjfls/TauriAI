<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri + React + Typescript</title>
</head>

<body>
  <div id="tauriai-boot" style="position:fixed;left:8px;top:8px;z-index:2147483647;max-width:calc(100vw - 16px);padding:6px 8px;border-radius:8px;background:rgba(255,255,255,0.92);border:1px solid rgba(0,0,0,0.12);color:#111;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,\"Liberation Mono\",\"Courier New\",monospace;white-space:pre-wrap;word-break:break-word;">
    正在加载…
  </div>
  <script>
    (function () {
      var el = document.getElementById('tauriai-boot');
      if (!el) return;

      var set = function (msg) {
        try {
          el.textContent = String(msg || '');
        } catch (e) {
          // ignore
        }
      };

      var shorten = function (v) {
        try {
          if (typeof v === 'string') return v;
          if (v && typeof v.message === 'string') return v.message;
          return String(v);
        } catch (e) {
          return '(unprintable)';
        }
      };

      var envInfo = function () {
        try {
          var href = window.location && window.location.href ? String(window.location.href) : '';
          var baseURI = document && document.baseURI ? String(document.baseURI) : '';
          var ua = navigator && navigator.userAgent ? String(navigator.userAgent) : '';
          var out = [];
          if (href) out.push('href: ' + href);
          if (baseURI && baseURI !== href) out.push('baseURI: ' + baseURI);
          if (ua) out.push('ua: ' + ua);
          return out.join('\n');
        } catch (e) {
          return '';
        }
      };

      // Capture resource-load and runtime errors early (useful for white-screen diagnostics in production builds).
      window.addEventListener('error', function (event) {
        try {
          var target = event && event.target;
          var tag = target && target.tagName ? String(target.tagName) : '';
          if (tag) {
            var src = target.src || target.href;
            if (src) {
              var lines = [];
              lines.push('资源加载失败: ' + src);
              var info = envInfo();
              if (info) lines.push(info);
              set(lines.join('\n'));
              return;
            }
          }

          var message = event && event.message ? String(event.message) : '';
          var filename = event && event.filename ? String(event.filename) : '';
          var lineno = event && typeof event.lineno === 'number' ? event.lineno : null;
          var colno = event && typeof event.colno === 'number' ? event.colno : null;
          var err = event && event.error ? event.error : null;

          var lines2 = [];
          if (message) {
            lines2.push('JS 错误: ' + message);
          } else if (err) {
            lines2.push('JS 错误: ' + shorten(err));
          } else {
            lines2.push('JS 错误: (unknown)');
          }

          if (filename) lines2.push('file: ' + filename);
          if (lineno !== null || colno !== null) {
            lines2.push('loc: ' + String(lineno || 0) + ':' + String(colno || 0));
          }

          try {
            var stack = err && err.stack ? String(err.stack) : '';
            if (stack) lines2.push('stack:\n' + stack);
          } catch (e) {
            // ignore
          }

          var info2 = envInfo();
          if (info2) lines2.push(info2);
          set(lines2.join('\n'));
        } catch (e) {
          // ignore
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        try {
          var reason = event && event.reason;
          var lines = [];
          lines.push('未处理的 Promise 拒绝: ' + shorten(reason));
          try {
            var stack = reason && reason.stack ? String(reason.stack) : '';
            if (stack) lines.push('stack:\n' + stack);
          } catch (e) {
            // ignore
          }
          var info = envInfo();
          if (info) lines.push(info);
          set(lines.join('\n'));
        } catch (e) {
          // ignore
        }
      });
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

[package]
name = "tauri-ai"
version = "0.1.0"
description = "TauriAI desktop application"
authors = ["you"]
edition = "2021"
default-run = "tauri-ai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = "0.18"
base64 = "0.22"
anyhow = "1"
sha1 = "0.10.6"
filetime = "0.2"
walkdir = "2"
dunce = "1"
image = { version = "0.25.8", default-features = false, features = ["png"] }

# HTTP client with streaming support
#
# 说明：
# - 默认的 `reqwest` 会启用 `default-tls`（native-tls/openssl），在 Android 交叉编译时容易卡在 openssl-sys。
# - 这里改为 rustls，减少跨平台构建阻力（Android/iOS/desktop 均可用）。
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
urlencoding = "2"
sse-stream = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Async trait support
async-trait = "0.1"

# Stream utilities
futures = "0.3"

# Directory utilities
dirs = "5"
dashmap = "6.1.0"
tauri-plugin-notification = "2"

[dev-dependencies]
# Temporary directories for testing
tempfile = "3"
# Property-based testing
proptest = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
muda = "0.17"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
tui-textarea = "0.7"
unicode-width = "0.2"

# MCP client (Model Context Protocol)
rmcp = { version = "0.12.0", default-features = false, features = [
  "base64",
  "client",
  "macros",
  "schemars",
  "server",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }

# SQLite database - desktop only for now
rusqlite = { version = "0.32", features = ["bundled"] }

# Cross-platform PTY (Windows ConPTY / Unix PTY)
portable-pty = "0.8"

# Code intelligence (AST parsing)
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-lua = "0.4.1"
tree-sitter-go = "0.23"

# Desktop-only OS integrations
notify = "6"
arboard = "3.6.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# MCP client (Model Context Protocol) - mobile: only remote transports (streamable_http / sse)
rmcp = { version = "0.12.0", default-features = false, features = [
  "base64",
  "client",
  "macros",
  "schemars",
  "server",
  "transport-streamable-http-client-reqwest",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 仅用于开发态动态设置 Dock 图标（不影响 build 产物图标）
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Used to write raw PNG bytes into the Windows clipboard (registered "PNG" format),
# as a fallback when decoding PNG -> RGBA fails.
clipboard-win = { version = "5.4.1", features = ["std"] }
webview2-com = "0.38"

[package]
name = "tauri-ai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
anyhow = "1"
sha1 = "0.10.6"
filetime = "0.2"
walkdir = "2"
dunce = "1"
image = { version = "0.25.8", default-features = false, features = ["png"] }

# HTTP client with streaming support
#
# 说明：
# - 默认的 `reqwest` 会启用 `default-tls`（native-tls/openssl），在 Android 交叉编译时容易卡在 openssl-sys。
# - 这里改为 rustls，减少跨平台构建阻力（Android/iOS/desktop 均可用）。
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
urlencoding = "2"
sse-stream = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Async trait support
async-trait = "0.1"

# Stream utilities
futures = "0.3"

# Directory utilities
dirs = "5"

[dev-dependencies]
# Temporary directories for testing
tempfile = "3"
# Property-based testing
proptest = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# MCP client (Model Context Protocol) - desktop only for now
rmcp = { version = "0.12.0", default-features = false, features = [
  "base64",
  "client",
  "macros",
  "schemars",
  "server",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }

# SQLite database - desktop only for now
rusqlite = { version = "0.32", features = ["bundled"] }

# Cross-platform PTY (Windows ConPTY / Unix PTY)
portable-pty = "0.8"

# Desktop-only OS integrations
notify = "6"
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
# 仅用于开发态动态设置 Dock 图标（不影响 build 产物图标）
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
